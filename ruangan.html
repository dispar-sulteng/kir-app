<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Data Ruangan — Sistem Informasi KIR</title>
<link rel="stylesheet" href="css/style.css" />
<script>
  if (localStorage.getItem("kir_logged_in") !== "true") {
    window.location.href = "index.html";
  }
</script>
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar" id="topbar"></header>

    <main class="content">
      <div class="toolbar">
        <div></div>
        <button class="btn btn-primary" id="btn-tambah-ruangan" type="button">+ Tambah Ruangan</button>
      </div>

      <div class="ruangan-grid" id="ruangan-grid"></div>
    </main>
  </div>
</div>

<!-- MODAL TAMBAH / EDIT RUANGAN -->
<div class="modal-overlay" id="modal-ruangan">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-ruangan-title">Tambah Ruangan</h2>
      <button class="modal-close" type="button" id="modal-ruangan-close">&times;</button>
    </div>
    <form id="form-ruangan">
      <div class="modal-body">
        <input type="hidden" id="ruangan-id" />
        <div class="field">
          <label for="ruangan-nama">Nama Ruangan *</label>
          <input type="text" id="ruangan-nama" placeholder="Contoh: Ruang Kepala Dinas" />
          <div class="field-error" id="err-ruangan-nama">Nama ruangan wajib diisi.</div>
        </div>
        <div class="field">
          <label for="ruangan-keterangan">Keterangan</label>
          <textarea id="ruangan-keterangan" rows="3" placeholder="Contoh: Lantai 2, sisi timur"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="modal-ruangan-cancel">Batal</button>
        <button type="submit" class="btn btn-primary">Simpan Ruangan</button>
      </div>
    </form>
  </div>
</div>

<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/ruangan.js"></script>
</body>
</html>
